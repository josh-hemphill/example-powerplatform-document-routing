openapi: 3.1.0
info:
  title: Document Routing API
  version: 1.3.0
  description: |
    Routes freeform document requests through drafting and a chain of approvals,
    then publishes an approved PDF to SharePoint. In Power Platform, this API is
    typically exposed as a Custom Connector or wrapped by a Power Automate flow.

    **Identity:** The caller principal is derived from the Power Apps / Dataverse
    security context in production. The local Vite mock accepts
    `X-Document-Routing-Actor` (and optional `X-Document-Routing-Roles`) as a
    stand-in. Request bodies must not carry spoofable `actorEmail` / requester identity.

    **Workflow (Phase 3):** Submit materializes approval steps from document-type
    control data (client step override only when `allowApproverOverride` is on).
    Claim/release preserve `activateDueAt`. SLA elevation converts overdue named
    steps to an elevated pool queue. Production SLA sweeps run via Cloud Flow;
    the mock accepts a DEV-only `now` clock override.

    **Control / Admin (Phase 4):** `/control/*` mirrors Dataverse control tables.
    Reads of active document types are available to authenticated users; writes
    require the Admin role.
servers:
  - url: /api
    description: Local Vite mock (development)
  - url: https://{environment}.crm.dynamics.com/api/document-routing
    description: Power Platform hosted API
    variables:
      environment:
        default: contoso
tags:
  - name: Documents
  - name: Approvals
  - name: Publishing
  - name: Control
security:
  - PrincipalHeader: []
paths:
  /documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      summary: List document routing cases
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: documentType
          in: query
          description: Filter by configured document type id (policy, sop, …)
          schema:
            type: string
        - name: q
          in: query
          description: Free-text search across title and request body
          schema:
            type: string
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
    post:
      operationId: createDocumentRequest
      tags: [Documents]
      summary: Submit a freeform document request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Created request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
  /documents/{documentId}:
    get:
      operationId: getDocument
      tags: [Documents]
      summary: Get a document routing case
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{documentId}/draft:
    put:
      operationId: updateDocumentDraft
      tags: [Documents]
      summary: Author or update the draft content
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftRequest'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/submit-for-approval:
    post:
      operationId: submitForApproval
      tags: [Approvals]
      summary: Move a draft into the approval chain
      description: |
        Materializes steps from the document type’s control chain unless
        `allowApproverOverride` is enabled and `steps` are supplied.
        Rejects empty chains and unknown document types.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitForApprovalRequest'
      responses:
        '200':
          description: Submitted for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/withdraw-and-revise:
    post:
      operationId: withdrawAndRevise
      tags: [Approvals]
      summary: Withdraw review and return to drafting
      description: |
        Clears approval steps and returns the case to `drafting` so authors can
        revise content. Allowed from `in_review`, `rejected`, or `approved`
        for the requester, author, or collaborators.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActorRequest'
      responses:
        '200':
          description: Document returned to drafting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/approvals/{stepId}/decision:
    post:
      operationId: decideApprovalStep
      tags: [Approvals]
      summary: Approve or reject the current claimed/named approval step
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Updated document after decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/approvals/{stepId}/claim:
    post:
      operationId: claimApprovalStep
      tags: [Approvals]
      summary: Self-assign a queued pool approval step
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActorRequest'
      responses:
        '200':
          description: Step claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/approvals/{stepId}/release:
    post:
      operationId: releaseApprovalStep
      tags: [Approvals]
      summary: Return a claimed pool step to the queue
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActorRequest'
      responses:
        '200':
          description: Step released back to queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/approvals/process-sla:
    post:
      operationId: processApprovalSla
      tags: [Approvals]
      summary: Process SLA timeouts and elevate overdue steps (scheduler / flow entrypoint)
      description: |
        Production callers are Cloud Flows under a service identity; they omit `now`.
        The local mock accepts `now` only when running in development (`import.meta.env.DEV`).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessSlaRequest'
      responses:
        '200':
          description: Document after SLA processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{documentId}/publish:
    post:
      operationId: publishDocumentPdf
      tags: [Publishing]
      summary: Render the approved document as PDF and publish to SharePoint
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /control/document-types:
    get:
      operationId: listDocumentTypes
      tags: [Control]
      summary: List document types (active for users; all for admins)
      responses:
        '200':
          description: Document type catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlDocumentType'
    post:
      operationId: createDocumentType
      tags: [Control]
      summary: Create a document type (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlDocumentTypeWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDocumentType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /control/document-types/{typeId}:
    parameters:
      - name: typeId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDocumentTypeConfig
      tags: [Control]
      summary: Get one document type
      responses:
        '200':
          description: Document type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDocumentType'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateDocumentType
      tags: [Control]
      summary: Update a document type including approval chain (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlDocumentTypeWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDocumentType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deactivateDocumentType
      tags: [Control]
      summary: Deactivate a document type (Admin)
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDocumentType'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /control/approver-pools:
    get:
      operationId: listApproverPools
      tags: [Control]
      summary: List approver pools (Admin)
      responses:
        '200':
          description: Pools
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlApproverPool'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createApproverPool
      tags: [Control]
      summary: Create an approver pool (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlApproverPoolWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlApproverPool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /control/approver-pools/{poolId}:
    parameters:
      - name: poolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateApproverPool
      tags: [Control]
      summary: Update pool name/members (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlApproverPoolWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlApproverPool'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteApproverPool
      tags: [Control]
      summary: Delete an unused approver pool (Admin)
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /control/publish-destinations:
    get:
      operationId: listPublishDestinations
      tags: [Control]
      summary: List allowlisted publish destinations
      responses:
        '200':
          description: Destinations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlPublishDestination'
    post:
      operationId: createPublishDestination
      tags: [Control]
      summary: Create a publish destination (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlPublishDestinationWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPublishDestination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /control/publish-destinations/{destinationId}:
    parameters:
      - name: destinationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updatePublishDestination
      tags: [Control]
      summary: Update a publish destination (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlPublishDestinationWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPublishDestination'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deactivatePublishDestination
      tags: [Control]
      summary: Deactivate a publish destination (Admin)
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPublishDestination'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /control/settings:
    get:
      operationId: getControlSettings
      tags: [Control]
      summary: Read feature flags / collaboration settings (Admin)
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateControlSettings
      tags: [Control]
      summary: Update feature flags (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlSettings'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
  /control/flow-runs:
    get:
      operationId: listFlowRuns
      tags: [Control]
      summary: Recent Flow health rows (Admin, read-only)
      responses:
        '200':
          description: Flow runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlFlowRun'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    PrincipalHeader:
      type: apiKey
      in: header
      name: X-Document-Routing-Actor
      description: |
        Local mock stand-in for the authenticated caller email/UPN.
        Production Custom Connectors / Dataverse derive the principal from the
        token — this header is not used as a trust boundary when hosted.
    RolesHeader:
      type: apiKey
      in: header
      name: X-Document-Routing-Roles
      description: |
        Optional local mock stand-in for Dataverse security roles (comma-separated).
        Example: `user,author,admin`. Not required on every request — used by the
        mock for Admin gating. Production derives roles from the token.
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DocumentStatus:
      type: string
      enum:
        - requested
        - drafting
        - in_review
        - approved
        - rejected
        - published
    ApprovalStepStatus:
      type: string
      enum:
        - waiting
        - queued
        - pending
        - approved
        - rejected
        - skipped
    ApprovalAssignmentMode:
      type: string
      enum: [named, pool]
    SubmitForApprovalRequest:
      type: object
      properties:
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApprovalStepInput'
          description: |
            Optional when the server materializes the chain from document-type
            control data. Required only when `allowApproverOverride` is enabled.
        comment:
          type: string
    ApprovalStepInput:
      oneOf:
        - $ref: '#/components/schemas/NamedApprovalStepInput'
        - $ref: '#/components/schemas/PoolApprovalStepInput'
      discriminator:
        propertyName: assignmentMode
        mapping:
          named: '#/components/schemas/NamedApprovalStepInput'
          pool: '#/components/schemas/PoolApprovalStepInput'
    NamedApprovalStepInput:
      type: object
      required: [assignmentMode, assignee]
      properties:
        assignmentMode:
          type: string
          enum: [named]
        role:
          type: string
          description: Display role for the step (Legal, Compliance, …)
        slaHours:
          type: number
          exclusiveMinimum: 0
          description: Hours until SLA timeout from step activation (not reset on claim)
        assignee:
          $ref: '#/components/schemas/Approver'
        elevationPool:
          type: array
          items:
            $ref: '#/components/schemas/Approver'
          description: Extra members merged into the pool after SLA timeout (named → elevated pool)
    PoolApprovalStepInput:
      type: object
      required: [assignmentMode, pool]
      properties:
        assignmentMode:
          type: string
          enum: [pool]
        role:
          type: string
          description: Display role for the step (Legal, Compliance, …)
        slaHours:
          type: number
          exclusiveMinimum: 0
          description: Hours until SLA timeout from queue activation (not reset on claim)
        pool:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Approver'
          description: Eligible claimers for this pool step
        elevationPool:
          type: array
          items:
            $ref: '#/components/schemas/Approver'
          description: Extra members merged into the pool after SLA timeout
    Approver:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          description: e.g. Legal, Compliance, Department Head
    ApprovalActorRequest:
      type: object
      properties:
        comment:
          type: string
          description: Optional comment; actor is the authenticated principal
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          description: Optional comment; actor is the authenticated principal
    ProcessSlaRequest:
      type: object
      properties:
        now:
          type: string
          format: date-time
          description: |
            DEV/test clock override only. Production Cloud Flows omit this.
            Invalid timestamps are rejected; non-DEV mocks ignore the field.
    PublishRequest:
      type: object
      required: [sharePointSiteUrl, libraryName]
      properties:
        sharePointSiteUrl:
          type: string
          format: uri
        libraryName:
          type: string
        folderPath:
          type: string
          description: Optional folder under the library
          default: /
        fileName:
          type: string
          description: Overrides the default PDF file name
    CreateDocumentRequest:
      type: object
      required: [title, freeformRequest, documentType]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        documentType:
          type: string
          description: Document type id from the app config (drives approval chain + draft template)
        freeformRequest:
          type: string
          minLength: 10
          description: Unstructured request text that authors turn into a draft
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
        requestedPublishSiteUrl:
          type: string
          format: uri
          description: Target SharePoint site for the final PDF
        requestedLibraryName:
          type: string
          description: SharePoint document library display name
          default: Published Documents
    UpdateDraftRequest:
      type: object
      required: [title, bodyMarkdown]
      properties:
        title:
          type: string
          minLength: 3
        bodyMarkdown:
          type: string
          minLength: 1
        summary:
          type: string
          description: Optional summary; author is set from the authenticated principal
    DocumentSummary:
      type: object
      required:
        - id
        - title
        - status
        - documentType
        - requesterEmail
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        documentType:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        requesterEmail:
          type: string
          format: email
        collaboratorEmails:
          type: array
          items:
            type: string
            format: email
          description: Author collaboration team shared on create for co-editing drafts
        priority:
          type: string
          enum: [low, normal, high]
        currentApproverEmail:
          type: string
          format: email
          nullable: true
        currentStepStatus:
          allOf:
            - $ref: '#/components/schemas/ApprovalStepStatus'
          nullable: true
        currentStepDueAt:
          type: string
          format: date-time
          nullable: true
        currentStepElevated:
          type: boolean
          nullable: true
        currentPoolEmails:
          type: array
          items:
            type: string
            format: email
          description: Eligible claimers when the active step is a pool queue
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contentRevision:
          type: integer
          minimum: 0
          description: Incremented on each draft save
        submittedContentRevision:
          type: integer
          nullable: true
