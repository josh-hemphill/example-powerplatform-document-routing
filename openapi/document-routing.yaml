    ApprovalStep:
      type: object
      required:
        - id
        - order
        - assignmentMode
        - status
        - pool
        - elevated
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 1
        assignmentMode:
          $ref: '#/components/schemas/ApprovalAssignmentMode'
        approverEmail:
          type: string
