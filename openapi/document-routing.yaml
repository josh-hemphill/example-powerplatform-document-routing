openapi: 3.1.0
info:
  title: Document Routing API
  version: 1.8.0
  description: |
    Routes freeform document requests through drafting and a chain of approvals,
    then publishes an approved PDF to SharePoint. In Power Platform, this API is
    typically exposed as a Custom Connector or wrapped by a Power Automate flow.

    **Identity:** The caller principal is derived from the Power Apps / Dataverse
    security context in production. The local Vite mock accepts
    `X-Document-Routing-Actor` (and optional `X-Document-Routing-Roles`) as a
    stand-in. Request bodies must not carry spoofable `actorEmail` / requester identity.

    **Review comments (Phase 23):** `reviewcomment` is the human-feedback store.
    Decision comments are written at decide-time and **survive** withdraw/revise.
    `historyevent` stays a short machine audit (`Rejected by Compliance`) and is
    not a substitute body. Authoritative open comments block resubmit.
    Authors `POST …/review-comments/{id}/respond` or `/acknowledge`.

    **Priorities (Phase 25):** `priority` is a catalog **key** (`GET /control/priority-levels`),
    not a hardcoded enum. Rows with `requiresReason` must include `priorityReason`
    of at least `minReasonLength` (seed mission-critical: 20). Unknown/inactive keys
    return 400 `unknown_priority`.

    **Subtypes (Phase 26):** Optional per document type. If a type has any active
    subtype, create requires `documentSubtypeId`. Submit materializes the subtype
    chain when `usesOwnChain` is true.

    **Workflow (Phase 3 / 10):** Submit materializes approval steps from document-type
    control data sorted by `order` (contiguous `1..n`). Client step override only when
    `allowApproverOverride` is on **and** the actor is Admin. Draft PUT requires
    `expectedContentRevision` (409 `revision_conflict` on mismatch). Claim/release
    preserve `activateDueAt`. Named SLA without an elevation pool is an intentional
    no-op. Production SLA sweeps run via Cloud Flow; the mock accepts a DEV-only
    `now` clock override.

    **Control / Admin (Phase 4):** `/control/*` mirrors Dataverse control tables.
    Reads of active document types are available to authenticated users; writes
    require the Admin role.

    **Publish (Phase 5):** Clients never upload PDF bytes. `POST …/publish` selects
    an allowlisted `publishDestinationId`; the mock/Flow renders HTML→PDF under a
    service identity. Filenames include document id + content revision; republishing
    the same revision is idempotent.

    **Controlled documents (Phase 8):** First publish allocates a human
    `documentNumber` from the document type sequence. Published finals are
    immutable; changes use `POST …/supersede` (new case). Prior becomes
    `superseded` when the successor publishes (same number, version + 1).

    **Contract (Phase 6):** OpenAPI 3.1 null unions (`type: [T, 'null']`), shared
    `401`/`403`/`409` responses, and schema-aligned request validation (title length).
servers:
  - url: /api
    description: Local Vite mock (development)
  - url: https://{environment}.crm.dynamics.com/api/document-routing
    description: Power Platform hosted API
    variables:
      environment:
        default: contoso
tags:
  - name: Documents
  - name: Approvals
  - name: Publishing
  - name: Control
  - name: Principal
security:
  - PrincipalHeader: []
  - PrincipalHeader: []
    RolesHeader: []
paths:
  /principal:
    get:
      operationId: getPrincipal
      tags: [Principal]
      summary: Resolve caller principal and Document Routing roles
      description: |
        Returns the authenticated caller's email and effective Document Routing
        roles. Production derives roles from Dataverse security roles assigned to
        the caller. The local mock resolves roles from a server-side directory
        keyed by actor email and **ignores** `X-Document-Routing-Roles` on this
        request (roles are never client-trusted here).
      responses:
        '200':
          description: Caller principal with roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      summary: List document routing cases
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: documentType
          in: query
          description: Filter by configured document type id (policy, sop, …)
          schema:
            type: string
        - name: q
          in: query
          description: Free-text search across title and request body
          schema:
            type: string
        - name: persona
          in: query
          description: Inbox persona filter (server-side; mirrors client personas)
          schema:
            type: string
            enum:
              - all
              - waiting_on_me
              - available_in_pool
              - my_requests
              - needs_draft
              - ready_to_publish
        - name: limit
          in: query
          description: Max items to return (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque pagination cursor from a prior nextCursor
          schema:
            type: string
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
                  nextCursor:
                    type: string
                    nullable: true
                    description: Pass as cursor on the next request; null when no more pages
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createDocumentRequest
      tags: [Documents]
      summary: Submit a freeform document request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Created request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/{documentId}:
    get:
      operationId: getDocument
      tags: [Documents]
      summary: Get a document routing case
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{documentId}/draft:
    put:
      operationId: updateDocumentDraft
      tags: [Documents]
      summary: Author or update the draft content
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftRequest'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/submit-for-approval:
    post:
      operationId: submitForApproval
      tags: [Approvals]
      summary: Move a draft into the approval chain
      description: |
        Materializes steps from the document type’s control chain sorted by `order`
        (contiguous `1..n`). Client-supplied `steps` are accepted only when
        `allowApproverOverride` is enabled **and** the actor is Admin; otherwise
        override attempts return 403. Rejects empty chains and unknown document types.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitForApprovalRequest'
      responses:
        '200':
          description: Submitted for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/withdraw-and-revise:
    post:
      operationId: withdrawAndRevise
      tags: [Approvals]
      summary: Withdraw review and return to drafting
      description: |
        Clears runtime approval steps and returns the case to `drafting` so authors
        can revise content. **Review comments are not deleted.** Allowed from
        `in_review`, `rejected`, or `approved` for the requester, author, or
        collaborators. Not allowed from `published` or `superseded` (use supersede).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActorRequest'
      responses:
        '200':
          description: Document returned to drafting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/approvals/{stepId}/decision:
    post:
      operationId: decideApprovalStep
      tags: [Approvals]
      summary: Approve or reject the current claimed/named approval step
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Updated document after decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/review-comments/{commentId}/respond:
    post:
      operationId: respondToReviewComment
      tags: [Approvals]
      summary: Author response that addresses an open review comment
      description: |
        Allowed for requester, author, or collaborators (same as withdraw).
        Sets the parent comment `status=addressed` and inserts a child
        `kind=author_response`. Authoritative comments require a non-whitespace
        body of at least 20 characters (`AUTHORITATIVE_RESPONSE_MIN_LENGTH`).
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCommentRespondRequest'
      responses:
        '200':
          description: Document with updated review comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/review-comments/{commentId}/acknowledge:
    post:
      operationId: acknowledgeReviewComment
      tags: [Approvals]
      summary: Acknowledge an open standard review comment without a long reply
      description: |
        Allowed for requester, author, or collaborators. Standard (and advisory)
        open decision comments may be acknowledged. Authoritative comments must
        be responded to, not acknowledged.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: Document with updated review comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/priority:
    put:
      operationId: updateDocumentPriority
      tags: [Documents]
      summary: Change priority on a requested or drafting case
      description: |
        Same catalog rules as create. Allowed for requester, author, or
        collaborators while the case is `requested` or `drafting`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePriorityRequest'
      responses:
        '200':
          description: Document with updated priority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/approvals/{stepId}/claim:
    post:
      operationId: claimApprovalStep
      tags: [Approvals]
      summary: Self-assign a queued pool approval step
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActorRequest'
      responses:
        '200':
          description: Step claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/approvals/{stepId}/release:
    post:
      operationId: releaseApprovalStep
      tags: [Approvals]
      summary: Return a claimed pool step to the queue
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActorRequest'
      responses:
        '200':
          description: Step released back to queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/approvals/process-sla:
    post:
      operationId: processApprovalSla
      tags: [Approvals]
      summary: Process SLA timeouts and elevate overdue steps (scheduler / flow entrypoint)
      description: |
        Production callers are Cloud Flows under a service identity (or Admin);
        they omit `now`. The local mock accepts `now` only when running in
        development (`import.meta.env.DEV`). End users must not call this
        endpoint — requires Admin or Flow/service principal.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessSlaRequest'
      responses:
        '200':
          description: Document after SLA processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{documentId}/publish:
    post:
      operationId: publishDocumentPdf
      tags: [Publishing]
      summary: Publish the approved revision to an allowlisted SharePoint destination
      description: |
        Starts trusted publish (mock or Cloud Flow). The client does **not** upload
        PDF/HTML bytes. Requires Publisher (or Admin) role **and** document case
        access (same visibility as GET). Idempotent for the same content revision.
        First publish allocates `documentNumber` + version 1.
        Publishing a superseding case marks the prior document `superseded` and
        keeps the same number with version + 1.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published document (or existing artifact for same revision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/supersede:
    post:
      operationId: supersedeDocument
      tags: [Documents]
      summary: Open a successor case that will supersede a published document
      description: |
        Creates a new drafting case linked via `supersedesDocumentId`. Allowed when
        the source is `published` and no open successor already exists. Published
        content is never edited in place.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '201':
          description: Successor document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /documents/{documentId}/abandon-supersede:
    post:
      operationId: abandonSupersede
      tags: [Documents]
      summary: Abandon an open supersede successor case
      description: |
        Marks a successor (`supersedesDocumentId` set) as `abandoned` when it is
        still open (`requested` / `drafting` / `in_review` / `approved`). After
        abandon, a new supersede may be opened on the prior published document.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: Successor abandoned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /library:
    get:
      operationId: listLibraryDocuments
      tags: [Documents]
      summary: List current controlled (published) documents
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search number, title, or type
        - name: documentType
          in: query
          schema:
            type: string
        - name: includeSuperseded
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Max items to return (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque pagination cursor from a prior nextCursor
          schema:
            type: string
      responses:
        '200':
          description: Library list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
                  nextCursor:
                    type: string
                    nullable: true
                    description: Pass as cursor on the next request; null when no more pages
        '401':
          $ref: '#/components/responses/Unauthorized'
  /documents/by-number/{documentNumber}:
    get:
      operationId: getDocumentByNumber
      tags: [Documents]
      summary: Resolve the current published document by controlled number
      parameters:
        - name: documentNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current published document for this number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /control/document-types:
    get:
      operationId: listDocumentTypes
      tags: [Control]
      summary: List document types (active for users; all for admins)
      responses:
        '200':
          description: Document type catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlDocumentType'
    post:
      operationId: createDocumentType
      tags: [Control]
      summary: Create a document type (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlDocumentTypeWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDocumentType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /control/document-types/{typeId}:
    parameters:
      - name: typeId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDocumentTypeConfig
      tags: [Control]
      summary: Get one document type
      responses:
        '200':
          description: Document type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDocumentType'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateDocumentType
      tags: [Control]
      summary: Update a document type including approval chain (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlDocumentTypeWrite'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDocumentType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deactivateDocumentType
      tags: [Control]
      summary: Deactivate a document type (Admin)
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlDocumentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /control/approver-pools:
    get:
      operationId: listApproverPools
      tags: [Control]
      summary: List approver pools (Admin)
      responses:
        '200':
          description: Pools
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlApproverPool'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createApproverPool
      tags: [Control]
      summary: Create an approver pool (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlApproverPoolWrite'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlApproverPool'
        '400':
