components:
  securitySchemes:
    PrincipalHeader:
      type: apiKey
      in: header
      name: X-Document-Routing-Actor
      description: |
        **Local mock only.** Stand-in for the authenticated caller email/UPN.
        Production Custom Connectors / Dataverse derive the principal from the
        token — this header is not a trust boundary when hosted and must be ignored.
    RolesHeader:
      type: apiKey
      in: header
      name: X-Document-Routing-Roles
      description: |
        **Local mock only.** Comma-separated stand-in for Dataverse security roles
        (example: `user,author,admin`). Production APIs **must ignore** this header
        and derive roles from the caller token / Dataverse security roles. Never
        treat client-supplied roles as a trust boundary when hosted.
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid caller principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Principal:
      type: object
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
        roles:
          type: array
          description: Effective Document Routing role tokens for UI / mock gating
          items:
            type: string
            enum: [user, author, approver, publisher, admin]
        securityRoleNames:
          type: array
          description: Optional Dataverse security role display names
          items:
            type: string
    DocumentStatus:
      type: string
      enum:
        - requested
        - drafting
        - in_review
        - approved
        - rejected
        - published
        - superseded
        - abandoned
    ApprovalStepStatus:
      type: string
      enum:
        - waiting
        - queued
        - pending
        - approved
        - rejected
        - skipped
    ApprovalAssignmentMode:
      type: string
      enum: [named, pool]
    SubmitForApprovalRequest:
      type: object
      properties:
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApprovalStepInput'
          description: |
            Optional when the server materializes the chain from document-type
            control data. Required only when `allowApproverOverride` is enabled.
        comment:
          type: string
    ApprovalStepInput:
      oneOf:
        - $ref: '#/components/schemas/NamedApprovalStepInput'
        - $ref: '#/components/schemas/PoolApprovalStepInput'
      discriminator:
        propertyName: assignmentMode
        mapping:
          named: '#/components/schemas/NamedApprovalStepInput'
          pool: '#/components/schemas/PoolApprovalStepInput'
    NamedApprovalStepInput:
      type: object
      required: [assignmentMode, assignee]
      properties:
        assignmentMode:
          type: string
          enum: [named]
        role:
          type: string
          description: Display role for the step (Legal, Compliance, …)
        slaHours:
          type: number
          exclusiveMinimum: 0
          description: Hours until SLA timeout from step activation (not reset on claim)
        authorityLevel:
          $ref: '#/components/schemas/AuthorityLevel'
        commentPolicy:
          $ref: '#/components/schemas/CommentPolicy'
        assignee:
          $ref: '#/components/schemas/Approver'
        elevationPool:
          type: array
          items:
            $ref: '#/components/schemas/Approver'
          description: Extra members merged into the pool after SLA timeout (named → elevated pool)
    PoolApprovalStepInput:
      type: object
      required: [assignmentMode, pool]
      properties:
        assignmentMode:
          type: string
          enum: [pool]
        role:
          type: string
          description: Display role for the step (Legal, Compliance, …)
        slaHours:
          type: number
          exclusiveMinimum: 0
          description: Hours until SLA timeout from queue activation (not reset on claim)
        authorityLevel:
          $ref: '#/components/schemas/AuthorityLevel'
        commentPolicy:
          $ref: '#/components/schemas/CommentPolicy'
        pool:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Approver'
          description: Eligible claimers for this pool step
        elevationPool:
          type: array
          items:
            $ref: '#/components/schemas/Approver'
          description: Extra members merged into the pool after SLA timeout
    Approver:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          description: e.g. Legal, Compliance, Department Head
    ApprovalActorRequest:
      type: object
      properties:
        comment:
          type: string
          description: Optional comment; actor is the authenticated principal
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          description: |
            Copied to `reviewcomment` (`kind=decision`) at decide-time. Required when
            the step’s `commentPolicy` is `required_on_reject` (reject) or
            `required_on_decision` (any decision). Missing required comment → 400
            `comment_required`. History records a short label only.
    ProcessSlaRequest:
      type: object
      properties:
        now:
          type: string
          format: date-time
          description: |
            DEV/test clock override only. Production Cloud Flows omit this.
            Invalid timestamps are rejected; non-DEV mocks ignore the field.
    PublishRequest:
      type: object
      properties:
        publishDestinationId:
          type: string
          format: uuid
          description: |
            Allowlisted publish destination id. When omitted, the document type’s
            default destination is used. Free-form SharePoint URLs are not accepted.
        folderPathOverride:
          type: string
          description: |
            Optional folder under the destination’s allowlisted root only.
            Rejected when outside that root.
    CreateDocumentRequest:
      type: object
      required: [title, freeformRequest, documentType]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        documentType:
          type: string
          description: Document type id from the app config (drives approval chain + draft template)
        freeformRequest:
          type: string
          minLength: 10
          description: Unstructured request text that authors turn into a draft
        priority:
          type: string
          default: normal
          description: |
            Catalog key from `GET /control/priority-levels` (seed `low`, `normal`,
            `high`, `mission_critical`). Unknown/inactive → 400 `unknown_priority`.
        priorityReason:
          type: string
          description: |
            Required when the selected catalog row has `requiresReason`. Too short
            → 400 `priority_reason_required`.
        documentSubtypeId:
          type: string
          description: |
            Required when the document type has any active subtype. Unknown/wrong
            type → 400 `unknown_subtype`. Missing when required → 400 `subtype_required`.
        requestedPublishSiteUrl:
          type: string
          format: uri
          deprecated: true
          description: |
            Ignored. Trusted publish uses allowlisted destinations only; do not
            send free-form SharePoint URLs.
        requestedLibraryName:
          type: string
          deprecated: true
          description: Ignored. Trusted publish uses allowlisted destinations only.
    UpdateDraftRequest:
      type: object
      required: [title, bodyMarkdown, expectedContentRevision]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        bodyMarkdown:
          type: string
          minLength: 1
          description: Non-whitespace draft markdown
        summary:
          type: string
          maxLength: 500
          description: Optional summary; author is set from the authenticated principal
        expectedContentRevision:
          type: integer
          minimum: 0
          description: |
            Must match the document’s current `contentRevision`. Mismatch returns
            409 with code `revision_conflict`.
    DocumentSummary:
      type: object
      required:
        - id
        - title
        - status
        - documentType
        - requesterEmail
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        documentType:
          type: string
        documentSubtypeId:
          type: [string, 'null']
          description: Subtype key or id when the type requires one
        status:
          $ref: '#/components/schemas/DocumentStatus'
        requesterEmail:
          type: string
          format: email
        collaboratorEmails:
          type: array
          items:
            type: string
            format: email
          description: Author collaboration team shared on create for co-editing drafts
        priority:
          type: string
          description: Catalog key (not a closed enum)
        openAuthoritativeCommentCount:
          type: integer
          minimum: 0
          description: Count of open authoritative decision comments (blocks resubmit)
        lastReviewCommentPreview:
          type: [string, 'null']
          description: Truncated newest decision-comment body (~140 chars) for inbox
        currentApproverEmail:
          type: [string, 'null']
          format: email
        currentStepStatus:
          oneOf:
            - $ref: '#/components/schemas/ApprovalStepStatus'
            - type: 'null'
        currentStepDueAt:
          type: [string, 'null']
          format: date-time
        currentStepElevated:
          type: [boolean, 'null']
        currentPoolEmails:
          type: array
          items:
            type: string
            format: email
          description: Eligible claimers when the active step is a pool queue
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        contentRevision:
          type: integer
          minimum: 0
          description: Incremented on each draft save
        submittedContentRevision:
          type: [integer, 'null']
          description: contentRevision frozen at submit-for-approval

        publishedContentRevision:
          type: [integer, 'null']
          description: contentRevision of the artifact currently published
        documentNumber:
          type: [string, 'null']
          description: Human-facing controlled document number (assigned on first publish)
        documentVersion:
          type: [integer, 'null']
          minimum: 1
          description: Controlled version (1 on first publish; increments on superseding publish)
        supersedesDocumentId:
          type: [string, 'null']
          format: uuid
          description: Prior published document this case will replace
        supersededByDocumentId:
          type: [string, 'null']
          format: uuid
          description: Successor document that replaced this one
        publishedAt:
          type: [string, 'null']
          format: date-time
          description: When this controlled version was published
    ApprovalStep:
      type: object
      required:
        - id
        - order
        - assignmentMode
        - status
        - pool
        - elevated
      properties:
        id:
          type: string
          format: uuid
        order:
          type: integer
          minimum: 1
        assignmentMode:
          $ref: '#/components/schemas/ApprovalAssignmentMode'
        approverEmail:
          type: [string, 'null']
          format: email
        approverDisplayName:
          type: [string, 'null']
        role:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ApprovalStepStatus'
        pool:
          type: array
          items:
            $ref: '#/components/schemas/Approver'
        elevationPool:
          type: array
          items:
            $ref: '#/components/schemas/Approver'
        slaHours:
          type: [number, 'null']
        activateDueAt:
          type: [string, 'null']
          format: date-time
          description: Immutable SLA deadline set when the step activates
        dueAt:
          type: [string, 'null']
          format: date-time
          description: Denormalized mirror of activateDueAt for inbox filters
        claimedAt:
          type: [string, 'null']
          format: date-time
        elevated:
          type: boolean
        elevatedAt:
          type: [string, 'null']
          format: date-time
        comment:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
        submittedRevision:
          type: [integer, 'null']
          description: Document contentRevision at submit
        approvedRevision:
          type: [integer, 'null']
          description: contentRevision recorded when this step approved
        authorityLevel:
          $ref: '#/components/schemas/AuthorityLevel'
        commentPolicy:
          $ref: '#/components/schemas/CommentPolicy'
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          required:
            - freeformRequest
            - approvalSteps
            - history
            - contentRevision
            - reviewComments
          properties:
            freeformRequest:
              type: string
            draftBodyMarkdown:
              type: [string, 'null']
            draftSummary:
              type: [string, 'null']
            authorEmail:
              type: [string, 'null']
              format: email
            contentRevision:
              type: integer
              minimum: 0
            submittedContentRevision:
              type: [integer, 'null']
            publishedContentRevision:
              type: [integer, 'null']
            priorityReason:
              type: [string, 'null']
            documentSubtypeId:
              type: [string, 'null']
            approvalSteps:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalStep'
            reviewComments:
              type: array
              items:
                $ref: '#/components/schemas/ReviewComment'
            history:
              type: array
              items:
                $ref: '#/components/schemas/HistoryEvent'
            publishedPdfUrl:
              type: [string, 'null']
              format: uri
            sharePointItemId:
              type: [string, 'null']
            requestedPublishSiteUrl:
              type: [string, 'null']
              format: uri
            requestedLibraryName:
              type: [string, 'null']
    HistoryEvent:
      type: object
      required: [id, at, actorEmail, action, message]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorEmail:
          type: string
          format: email
        action:
          type: string
        message:
          type: string
        reviewCommentId:
          type: [string, 'null']
          format: uuid
          description: Optional link to the reviewcomment written at the same time
    PublishResult:
      type: object
      required:
        - document
        - pdfFileName
        - sharePointUrl
        - publishedAt
      properties:
        document:
          $ref: '#/components/schemas/Document'
        pdfFileName:
          type: string
        sharePointUrl:
          type: string
          format: uri
        sharePointItemId:
          type: string
        publishedAt:
          type: string
          format: date-time
        idempotent:
          type: boolean
          description: True when the same revision was already published and no new file was created
    ControlChainStep:
      type: object
      required: [order, assignmentMode, role]
      properties:
        order:
          type: integer
          minimum: 1
        assignmentMode:
          $ref: '#/components/schemas/ApprovalAssignmentMode'
        role:
          type: string
        slaHours:
          type: number
          exclusiveMinimum: 0
        assignee:
          $ref: '#/components/schemas/Approver'
        poolKey:
          type: string
          description: Key of an approver pool for pool steps
        elevationPoolKey:
          type: string
        authorityLevel:
          $ref: '#/components/schemas/AuthorityLevel'
        commentPolicy:
          $ref: '#/components/schemas/CommentPolicy'
    ControlDocumentType:
      type: object
      required:
        - id
        - label
        - description
        - requestHint
        - draftTemplate
        - active
        - policyVersion
